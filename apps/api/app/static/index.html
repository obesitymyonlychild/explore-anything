<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <!-- Home-screen app: opens full screen, with its own name and icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Explore">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <title>Explore Anything</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-thread" class="primary">+ New</button>
      <button id="surprise">🎲 Surprise me</button>
      <h2>Threads</h2>
      <ul id="threads" class="thread-list"></ul>
      <h2>Concepts</h2>
      <ul id="concepts" class="thread-list"></ul>
      <p id="spend" class="spend muted" title="API spend that counts toward the budgets in .env"></p>
    </aside>

    <main class="main">
      <header class="thread-header">
        <button type="button" id="menu" class="phone-only icon-button" aria-label="Threads and concepts" aria-expanded="false">☰</button>
        <h1 id="thread-title">New exploration</h1>
        <button type="button" id="notes" class="phone-only">Notes</button>
        <div id="lang" class="lang" role="group" aria-label="Card language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh" lang="zh-Hans">中文</button>
          <button type="button" data-lang="both">Both</button>
        </div>
        <label class="depth">depth
          <select id="depth">
            <option value="glance">glance</option>
            <option value="explain" selected>explain</option>
            <option value="mechanism">mechanism</option>
            <option value="expert">expert</option>
          </select>
        </label>
      </header>

      <div id="banner" class="error banner" hidden></div>

      <section id="messages" class="messages" aria-live="polite">
        <div id="empty" class="empty">
          <p>Type a concept or a question to start exploring.</p>
          <p class="muted">e.g. "how does air conditioning work?", "tides", "why do bridges sway?"</p>
        </div>
      </section>

      <form id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="Ask anything…" autocomplete="off"></textarea>
        <button type="submit" id="send" class="primary">Send</button>
        <button type="button" id="stop" hidden>Stop</button>
      </form>
    </main>

    <aside class="panel" aria-label="Concept">
      <div class="sheet-bar phone-only">
        <span class="muted">Notes</span>
        <button type="button" id="sheet-close" class="icon-button" aria-label="Close notes">✕</button>
      </div>
      <div id="panel">
        <p class="muted">Your links and takeaways for the current concept show up here.</p>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
  </div>
  <datalist id="concept-options"></datalist>
  <script src="/static/app.js"></script>
</body>
</html>
