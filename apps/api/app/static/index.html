<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Anything</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-thread" class="primary">+ New</button>
      <button id="surprise">🎲 Surprise me</button>
      <h2>Threads</h2>
      <ul id="threads" class="thread-list"></ul>
      <h2>Concepts</h2>
      <ul id="concepts" class="thread-list"></ul>
    </aside>

    <main class="main">
      <header class="thread-header">
        <h1 id="thread-title">New exploration</h1>
        <label class="depth">depth
          <select id="depth">
            <option value="glance">glance</option>
            <option value="explain" selected>explain</option>
            <option value="mechanism">mechanism</option>
            <option value="expert">expert</option>
          </select>
        </label>
      </header>

      <div id="banner" class="error banner" hidden></div>

      <section id="messages" class="messages" aria-live="polite">
        <div id="empty" class="empty">
          <p>Type a concept or a question to start exploring.</p>
          <p class="muted">e.g. "how does air conditioning work?", "tides", "why do bridges sway?"</p>
        </div>
      </section>

      <form id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="Ask anything…" autocomplete="off"></textarea>
        <button type="submit" id="send" class="primary">Send</button>
        <button type="button" id="stop" hidden>Stop</button>
      </form>
    </main>

    <aside id="panel" class="panel" aria-label="Concept">
      <p class="muted">Your links and takeaways for the current concept show up here.</p>
    </aside>
  </div>
  <datalist id="concept-options"></datalist>
  <script src="/static/app.js"></script>
</body>
</html>
