<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Explore">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <title>Sign in · Explore Anything</title>
  <style>
    :root { --bg: #fafaf9; --panel: #ffffff; --fg: #1c1917; --muted: #78716c; --border: #e7e5e4; --accent: #2563eb; --accent-fg: #ffffff; --error-fg: #991b1b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --panel: #262220; --fg: #f5f5f4; --muted: #a8a29e; --border: #3a3532; --accent: #60a5fa; --accent-fg: #0b1220; --error-fg: #fecaca; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    form { width: 100%; max-width: 320px; display: grid; gap: 12px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); }
    input { background: var(--panel); color: var(--fg); }
    button { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); cursor: pointer; }
    .wrong { color: var(--error-fg); margin: 0; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Explore Anything</h1>
    <p class="wrong" id="wrong" hidden>Wrong password. Try again.</p>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("wrong")) document.getElementById("wrong").hidden = false;
  </script>
</body>
</html>
