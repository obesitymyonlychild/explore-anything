<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141416">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Explore">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Silkscreen&display=swap">
  <title>Sign in · Explore Anything</title>
  <!-- Its own small stylesheet: /static/style.css sits behind the password. Same tokens. -->
  <style>
    :root { color-scheme: dark; --glass: rgb(16 16 18 / 0.80); --line: rgb(255 255 255 / 0.10); --fg: #f3efe9; --muted: #a9a29b; --accent: #f29aa8; --accent-fg: #2b0f15; --error-fg: #fecaca; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #3a3a3a; color: var(--fg); font: 14px/1.6 "JetBrains Mono", ui-monospace, Menlo, monospace; -webkit-font-smoothing: antialiased; }
    body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -1; }
    body::before { background: url(/static/fur.jpg) center / cover; }
    body::after { background: rgb(10 10 12 / 0.35); }
    form { width: 100%; max-width: 340px; display: grid; gap: 12px; padding: 28px 24px 24px; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.35); }
    img { width: 80px; height: 80px; border-radius: 18px; justify-self: center; image-rendering: pixelated; }
    h1 { font: 400 15px/1.3 "Silkscreen", ui-monospace, monospace; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; margin: 4px 0 6px; }
    input, button { font: inherit; color: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
    input { background: rgb(255 255 255 / 0.04); font-size: 16px; }
    input::placeholder { color: var(--muted); }
    input:focus { outline: none; border-color: var(--accent); }
    button { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; cursor: pointer; }
    button::before { content: "> "; opacity: 0.55; }
    .wrong { color: var(--error-fg); margin: 0; text-align: center; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <img src="/static/icons/icon.svg" alt="">
    <h1>Explore Anything</h1>
    <p class="wrong" id="wrong" hidden>wrong password. try again.</p>
    <input type="password" name="password" placeholder="password_" autocomplete="current-password" autofocus required>
    <button type="submit">sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("wrong")) document.getElementById("wrong").hidden = false;
  </script>
</body>
</html>
