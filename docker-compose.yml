services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: explore
      POSTGRES_PASSWORD: explore
      POSTGRES_DB: explore
    ports:
      # 5433 on the host to avoid clashing with a local Postgres; this Mac only, never the network
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explore -d explore"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
